name: Enforcement contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install framework and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify native and installed enforcement boundaries
        run: |
          pytest -q \
            tests/test_coordination_hook.py \
            tests/test_prewrite_read_repair_invariant.py \
            tests/test_claim_bootstrap.py \
            tests/test_generate_hook_wiring.py::test_installed_prewrite_runtime_projects_and_classifies_native_payloads
