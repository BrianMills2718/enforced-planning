version: 1
# Rebuilt 2026-09-02 from a fresh filesystem sweep of every directory
# containing an enforced_planning/ install (37 consumers + this source repo),
# not the prior hand-maintained 16-entry list, which had drifted stale:
# 4 of its paths pointed at directories that had moved (project-meta,
# llm_client, research_v3, osint_tools all relocated ~/projects -> ~/code),
# including this repo's own "source" entry -- meaning fleet tooling reading
# that field had been resolving the framework source to a stale clone.
# Where a repo's remote existed checked out in two places, the more recently
# committed-to checkout was kept as canonical (verified via `git log -1`,
# not guessed).
repos:
  - id: enforced-planning
    path: ~/code/active/enforced-planning
    tier: source
  - id: ac15
    path: ~/code/ac15
    tier: governed
