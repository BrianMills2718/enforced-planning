# Enforced Planning Configuration
# Copy this to your project root as meta-process.yaml
#
# This is the minimal functional config surface: keys below have script effect
# today or are consumed directly by generated CI/templates.
#
# For broader planned/advisory vocabulary that is not part of the minimum live
# config contract, see templates/meta-process.future.yaml.example.

meta_process:
  version: "1.0"

  # =============================================================================
  # CORE PATTERNS (Usually always enabled)
  # =============================================================================

  plans:
    enabled: true
    # Require tests defined in plan's "Required Tests" section
    require_tests: true
    # Max lines for [Trivial] commits (no plan required)
    plans_dir: "docs/plans"
    integrity:
      # off | observe | enforce. Applies only at/above minimum_plan_number.
      mode: "enforce"
      contract_version: "1.0.0"
      minimum_plan_number: 125

  claims:
    enabled: true
    # Require claim before creating worktree
    require_for_worktree: true
    # Record pre-write ownership decisions without blocking edits during calibration.
    prewrite_mode: enforce
    # Require the exact selected outcome at source lifecycle and native writes.
    outcome_admission_mode: enforce_selected

  artifact_creation:
    # Portable support is installed; each repository owns its directory rules.
    mode: "off"
    policy_file: "scripts/artifact_directory_policy.yaml"
    registry_file: "scripts/relationships.yaml"

  worktrees:
    enabled: true
    # Block edits in main directory (force worktree usage)
    protect_main: true

  commits:
    # Require a durable planning/provenance prefix
    require_prefix: true
    # Valid prefixes (regex patterns)
    valid_prefixes:
      - "\\[Plan #\\d+\\]"
      - "\\[Goal\\]"
      - "\\[Trivial\\]"
      - "\\[Unplanned\\]"  # Emergency escape hatch
  # =============================================================================
  # QUALITY GATES (Configurable strictness)
  # =============================================================================

  quality:
    # Which checks refuse a commit rather than warn. Keyed by the check name the
    # pre-commit hook passes to handle_failure. Anything not listed follows the
    # global ENFORCED_PLANNING_HOOK_MODE, which defaults to warn.
    #
    # doc-coupling is blocking here because it works. Measured 2026-08-24: it
    # correctly caught a staged change to coordination_claims.py whose coupled
    # operator guide was untouched, named the exact documents, and exited 1 --
    # and the commit landed anyway. The global switch could not be used, because
    # the dead-code check needs `vulture`, which is not installed. One
    # unavailable check was holding every working check advisory.
    hook_modes:
      "doc-coupling check": block

    doc_coupling:
      enabled: true
      # Mapping file location
      config_file: "scripts/relationships.yaml"

    dead_code:
      enabled: true           # source repo enforces dead-code detection on demand
      strict: true            # fail the target when dead code is detected
      min_confidence: 80      # vulture confidence threshold (60-100)
      paths:                  # bounded repo-local surface; avoids noisy temp files
        - "enforced_planning"
        - "scripts"
      whitelist: ".vulture_whitelist.py"
      audit_file: "dead_code_audit.json"

    reachability:
      enabled: true
      # This repo is entirely governance tooling (the framework's own source
      # + its scripts + its tests) -- no separate product/app package, so no
      # product_entrypoints is configured (same pattern as project-meta,
      # llm_client, process_tracing: the orphaned-module ratchet is the one
      # that applies here, not a product-share measurement).
      packages: ["enforced_planning", "scripts", "tests"]
      entrypoints:
        - "scripts/*.py"
        - "scripts/worktree-coordination/*.py"
        - "scripts/meta/*.py"
        - "scripts/meta/worktree-coordination/*.py"
        - "tests/**/*.py"
      dynamic: []
      ignore: []
      baseline: "reachability_baseline.json"

  # =============================================================================
  # CI CONFIGURATION
  # =============================================================================

  ci:
    # Skip CI with .github/ci-disabled file
    allow_disable_file: true
    # Jobs to include
    jobs:
      test: true
      mypy: true
      fast_checks: true
      plan_checks: true
      post_merge_sync: true
    # Change detection (skip jobs for docs-only changes)
    change_detection: true

# Additional project-specific settings normally live in separate files:
