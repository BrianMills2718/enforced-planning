[project]
name = "enforced-planning"
version = "0.1.0"
description = "Portable framework for enforced planning, context gating, and doc-code alignment in AI-assisted development"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
