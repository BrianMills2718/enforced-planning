[project]
name = "enforced-planning"
version = "1.0.0"
description = "Portable framework for enforced planning, context gating, and doc-code alignment in AI-assisted development"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff", "mypy", "vulture"]

[dependency-groups]
dev = ["agentic-engineering-system", "pytest>=9.1", "import-linter>=2.15", "ruff", "pytest-xdist"]

[tool.uv.sources]
agentic-engineering-system = { git = "https://github.com/BrianMills2718/agentic-engineering-system-canonical", rev = "f2c745e8e0fc88f11830c13ab2feddaf78a3c391" }

[tool.lockstep]
source = ["enforced_planning"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["enforced_planning*"]

[tool.setuptools.package-data]
enforced_planning = ["*.yaml"]

[tool.ruff]
line-length = 120
# Keep the existing correctness rules stable across Ruff default expansions.
lint.select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "xdist_group: run with other members of the named group on one xdist worker (see `make test`)",
]
