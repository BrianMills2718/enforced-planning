[project]
name = "enforced-planning"
version = "1.0.0"
description = "Portable framework for enforced planning, context gating, and doc-code alignment in AI-assisted development"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "vulture"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["enforced_planning*"]

[tool.setuptools.package-data]
enforced_planning = ["*.yaml"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
