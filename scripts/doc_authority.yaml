schema_version: 2
indexed_authority_surfaces:
  - concern: active-plan-index
    kind: plan_index
    authority_surface: docs/plans/CLAUDE.md
    source_glob: docs/plans/[0-9]*_*.md
    resolution_mode: manual

doc_spine:
  root_doc: EXECUTION_BRIEF.md
  required_concerns:
    - execution_brief
    - north_star
    - current_state
    - gap_summary
    - roadmap
    - active_plan_index
  max_required_read_docs: 7
  max_required_read_words: 8000

role_budgets:
  execution_brief:
    max_words: 1200
  summary:
    max_words: 2000
  plan:
    max_words: 3500
  reference:
    max_words: 2500

docs:
  - path: EXECUTION_BRIEF.md
    authority: canonical
    doc_status: active
    concerns:
      - execution_brief
    role: execution_brief
    primary_parent: null

  - path: PLANNING_OPERATING_MODEL.md
    authority: canonical
    doc_status: active
    concerns:
      - north_star
    role: summary
    primary_parent: EXECUTION_BRIEF.md

  - path: docs/overview/CURRENT_STATE.md
    authority: canonical
    doc_status: active
    concerns:
      - current_state
    role: summary
    primary_parent: EXECUTION_BRIEF.md

  - path: docs/overview/GAP_SUMMARY.md
    authority: canonical
    doc_status: active
    concerns:
      - gap_summary
    role: summary
    primary_parent: EXECUTION_BRIEF.md
    required_context:
      - path: docs/overview/CURRENT_STATE.md
        reason: Gap summaries are only meaningful when read against the current state.
      - path: PLANNING_OPERATING_MODEL.md
        reason: The active gap is defined relative to the framework's north-star methodology.

  - path: ROADMAP.md
    authority: canonical
    doc_status: active
    concerns:
      - roadmap
    role: summary
    primary_parent: EXECUTION_BRIEF.md

  - path: docs/plans/CLAUDE.md
    authority: canonical
    doc_status: active
    concerns:
      - active_plan_index
    role: reference
    primary_parent: EXECUTION_BRIEF.md

  - path: docs/plans/55_enforced-planning_recursive_doc_spine_dogfood.md
    authority: canonical
    doc_status: active
    concerns: []
    role: plan
    primary_parent: docs/overview/GAP_SUMMARY.md
    governed_by:
      - adr/0009-doc-authority-governance-and-enforcement.md
      - adr/0010-agent-memory-as-planning-input.md
    required_context:
      - path: docs/plans/54_recursive-documentation-spine-and-required-read-closure.md
        reason: Plan #54 freezes the design contract that Plan #55 implements.
      - path: docs/designs/RECURSIVE_DOCUMENTATION_SPINE_AND_REQUIRED_READ_CLOSURE.md
        reason: The implementation must stay aligned with the approved recursive-spine model.
      - path: docs/plans/41_doc-authority-governance-and-enforcement.md
        reason: The first implementation remains constrained by the dedicated-config decision from Plan #41.

code_surfaces:
  - paths:
      - enforced_planning/doc_authority.py
      - tests/test_validate_doc_authority.py
      - scripts/doc_authority.yaml
      - docs/reference/DOC_AUTHORITY_SCHEMA.md
    primary_spec: docs/plans/55_enforced-planning_recursive_doc_spine_dogfood.md

  - paths:
      - enforced_planning/file_context.py
      - tests/test_file_context_scope.py
      - tests/test_doc_spine_file_context.py
    primary_spec: docs/plans/55_enforced-planning_recursive_doc_spine_dogfood.md

  - paths:
      - enforced_planning/plan_validation.py
      - tests/test_validate_plan.py
    primary_spec: docs/plans/55_enforced-planning_recursive_doc_spine_dogfood.md

