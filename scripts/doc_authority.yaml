schema_version: 2
indexed_authority_surfaces:
  - concern: active-plan-index
    kind: plan_index
    authority_surface: docs/plans/AGENTS.md
    source_glob: docs/plans/[0-9]*_*.md
    resolution_mode: manual

doc_spine:
  root_doc: EXECUTION_BRIEF.md
  required_concerns:
    - execution_brief
    - north_star
    - current_state
    - gap_summary
    - roadmap
    - active_plan_index
  max_required_read_docs: 7
  max_required_read_words: 8000

role_budgets:
  execution_brief:
    max_words: 1200
  summary:
    max_words: 2000
  plan:
    max_words: 3500
  reference:
    max_words: 2500

docs:
  - path: EXECUTION_BRIEF.md
    authority: canonical
    doc_status: active
    concerns:
      - execution_brief
      - north_star
    role: execution_brief
    primary_parent: null

  - path: ROADMAP.md
    authority: canonical
    doc_status: active
    concerns:
      - current_state
      - gap_summary
      - roadmap
    role: reference
    primary_parent: EXECUTION_BRIEF.md

  - path: docs/plans/AGENTS.md
    authority: canonical
    doc_status: active
    concerns:
      - active_plan_index
    role: reference
    primary_parent: EXECUTION_BRIEF.md

  - path: docs/reference/DOC_AUTHORITY_SCHEMA.md
    authority: canonical
    doc_status: active
    concerns: []
    role: reference
    primary_parent: EXECUTION_BRIEF.md
    governed_by:
      - adr/0009-doc-authority-governance-and-enforcement.md

code_surfaces:
  - paths:
      - enforced_planning/doc_authority.py
      - tests/test_validate_doc_authority.py
      - scripts/doc_authority.yaml
      - docs/reference/DOC_AUTHORITY_SCHEMA.md
    primary_spec: docs/reference/DOC_AUTHORITY_SCHEMA.md

  - paths:
      - enforced_planning/file_context.py
      - tests/test_file_context_scope.py
      - tests/test_doc_spine_file_context.py
    primary_spec: docs/reference/DOC_AUTHORITY_SCHEMA.md

  - paths:
      - enforced_planning/plan_validation.py
      - tests/test_validate_plan.py
    primary_spec: docs/reference/DOC_AUTHORITY_SCHEMA.md
