# Minimal governed-repo relationships graph scaffold.

required_reading:
  defaults:
    - CLAUDE.md

governance: []
couplings:
  - description: >-
      The claim/worktree/lane data model and lifecycle. A behavior change here
      changes what every downstream repo's claim registry actually means.
    sources:
      - "enforced_planning/coordination_claims.py"
      - "enforced_planning/session_lifecycle.py"
    docs:
      - "docs/guides/WORKTREE_COORDINATION_OPERATOR_GUIDE.md"

  - description: >-
      meta-process.yaml is the live config surface; CONFIG_REFERENCE.md is the
      authoritative table of which keys have script effect and which script
      reads each one. A new or changed key that isn't reflected there is a
      silently undocumented config surface.
    sources:
      - "meta-process.yaml"
      - "templates/meta-process.yaml.example"
      - "templates/meta-process.future.yaml.example"
    docs:
      - "docs/reference/CONFIG_REFERENCE.md"

  - description: >-
      Planning Integrity's parser, pre-mutation admission, direct claim seam,
      and installed plan/worktree templates implement Plan 125. Contract or
      template changes must keep the normative design, config reference, and
      operator entrypoint documentation aligned.
    sources:
      - "enforced_planning/plan_validation.py"
      - "enforced_planning/plan_readiness.py"
      - "enforced_planning/coordination_claims.py"
      - "scripts/check_plan_readiness.py"
      - "scripts/check_coordination_claims.py"
      - "templates/Makefile.worktree.block.template"
      - "templates/plan.md.template"
    docs:
      - "docs/plans/125_planning_integrity_loop.md"
      - "docs/reference/CONFIG_REFERENCE.md"
      - "docs/guides/WORKTREE_COORDINATION_OPERATOR_GUIDE.md"

  - description: >-
      The canonical installer/upgrader for consumer repos. GETTING_STARTED.md
      is the first-successful-install path a new consumer follows.
    sources:
      - "scripts/install_governed_repo.py"
    docs:
      - "GETTING_STARTED.md"

  - description: >-
      The doc-coupling checker and its config schema/pattern doc. Changing
      what a coupling entry means (field names, matching semantics) without
      updating the pattern doc leaves every consumer repo's relationships.yaml
      authored against a stale contract.
    sources:
      - "scripts/check_doc_coupling.py"
    docs:
      - "patterns/10_doc-code-coupling.md"

  - description: >-
      The session lifecycle CLI surface (start/heartbeat/status/end/finish/
      close). CLAUDE.md's Commands section is this repo's own documented
      entrypoint list for these scripts.
    sources:
      - "scripts/session_start.py"
      - "scripts/session_heartbeat.py"
      - "scripts/session_status.py"
      - "scripts/session_end.py"
      - "scripts/session_finish.py"
      - "scripts/session_close.py"
    docs:
      - "CLAUDE.md"
architecture: []
adrs: {}

documents:
  - path: README.md
    role: navigation
    justification:
      anchored_to: PLANNING_OPERATING_MODEL.md
      reason: Routes framework readers to the canonical operating model and the installed-consumer onboarding path.
    lifecycle_source: document_status
  - path: GETTING_STARTED.md
    role: authority
    justification:
      anchored_to: PLANNING_OPERATING_MODEL.md
      reason: Owns the shortest truthful installed-consumer path to a first successful governed-repository setup.
    lifecycle_source: document_status
  - path: docs/guides/NEW_PROJECT_SETUP.md
    role: execution
    justification:
      anchored_to: GETTING_STARTED.md
      reason: Provides the detailed operator procedure that intentionally complements, rather than duplicates, the first-success guide.
    lifecycle_source: document_status
  - path: docs/guides/WORKTREE_COORDINATION_OPERATOR_GUIDE.md
    role: authority
    justification:
      anchored_to: PLANNING_OPERATING_MODEL.md
      reason: Owns the current day-to-day coordination and worktree operator contract.
    lifecycle_source: document_status

# Optional scoped file coverage policy.
# - managed: files under managed include that are NOT explicitly registered
#   in governance/couplings/architecture will trigger policy actions.
# - unmanaged: files outside managed scope.
#
# Set managed.mode: hard-fail to require an explicit registration for every
# managed file before edits are allowed. Set managed.mode: warn to log soft warnings
# instead. Keep generated/large directories out of scope with managed.exclude.
#
# file_scope:
#   managed:
#     include: ["**"]
#     exclude: [".venv/**", ".claude/**", "generated/**"]
#     mode: warn
#   unmanaged:
#     mode: ignore
